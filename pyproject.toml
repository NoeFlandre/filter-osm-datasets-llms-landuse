[project]
name = "landuse-filter"
version = "0.1.0"
description = "Resumable multi-site Grid'5000 pipeline labelling OSM polygon sentences for land-use relevance with LFM2.5-2.6B + DSpark."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Noe Flandre", email = "noe.flandre@inria.fr" }]
dependencies = [
    "typer>=0.15",
    "pyarrow>=18",
    "huggingface-hub>=1.0",
    # numpy>=2.4 needs a newer CPU baseline: planning jobs died with SIGILL on older
    # Grid'5000 CPU nodes (Lyon jobs 2070945, 2070978).
    "numpy>=2.0,<2.4",
]

[project.optional-dependencies]
# Tokenisation happens on the planner side (CPU); the GPU node receives token ids.
tokenize = [
    "transformers>=4.57",
    "jinja2>=3.1",
]
# World map of the yes/no distribution on the dataset card (publish jobs only).
map = [
    "h3>=4.1",
    "matplotlib>=3.9",
]
# SGLang pins its own torch and transformers; versions match the benchmark's
# validated DSpark runtime (sglang 0.5.20, flashinfer 0.6.18).
gpu = [
    "sglang==0.5.20",
    "cuda-tile>=1.6.0rc5",
    "flash-attn-4>=4.0.0b18",
]

[project.scripts]
luf = "landuse_filter.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-bdd>=8.1",
    "hypothesis>=6.120",
    "ruff>=0.9",
    "ty>=0.0.1a1",
    "import-linter>=2.1",
    "radon>=6.0",
    "mutmut>=3.2",
]
docs = [
    "mkdocs-material>=9.6",
]

[tool.uv]
conflicts = [[{ extra = "tokenize" }, { extra = "gpu" }]]
prerelease = "if-necessary-or-explicit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/landuse_filter"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "PL", "RUF",
    "C90", "PIE", "PERF", "BLE", "DTZ", "ERA", "PGH", "TID", "T20", "FBT", "S", "ANN", "PT",
]

[tool.ruff.lint.pylint]
# Use cases take a store plus a few explicit inputs; beyond 7 they must be grouped.
max-args = 7
max-positional-args = 5

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S607", "PLR0917", "ARG005", "RUF059", "S311", "PLR2004", "ARG001", "ARG002", "RUF012", "PLC0415", "S101", "ANN", "FBT"]
"scripts/**" = ["T20", "PLR0917"]
# Adapters wrap untyped third-party runtimes and import optional ones lazily.
"src/landuse_filter/adapters/*" = ["ANN401", "PLC0415"]
# SSH/rsync/nvidia-smi/git are the adapters' job; arguments are built from our own data.
"src/landuse_filter/adapters/g5k.py" = ["S603", "S607"]
"src/landuse_filter/adapters/engine.py" = ["S603", "S607"]
# Shipped to a frontend and run with the stdlib only: prints JSON, fetches the G5K API.
"src/landuse_filter/adapters/remote/*" = ["T201", "S310", "ANN"]
# Use cases import optional runtimes lazily and shell out to git for the code commit.
"src/landuse_filter/application/*" = ["PLC0415", "S603", "S607"]
# The card is Markdown that shows an example DuckDB recipe; nothing is executed.
# The dataset card is Markdown prose in a template; hard-wrapping it would break the rendering.
"src/landuse_filter/application/card.py" = ["S608", "E501"]
# Typer maps flags to boolean parameters; a command's parameters are its interface.
"src/landuse_filter/cli/*" = ["PLC0415", "PLR0913", "PLR0917", "FBT001", "FBT002", "FBT003", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers -m 'not integration and not gpu'"
markers = [
    "integration: talks to the Hugging Face Hub or Grid'5000 (deselected by default)",
    "gpu: needs a CUDA GPU with SGLang installed (deselected by default)",
]

[tool.coverage.run]
source = ["src/landuse_filter"]
branch = true
# Need a GPU (SGLang), the real tokenizer, or a node: exercised on Grid'5000 and by the
# integration suite. SSH/OAR, the Hub and the bucket are unit-tested with fakes.
omit = [
    "src/landuse_filter/adapters/engine.py",
    "src/landuse_filter/adapters/tokenizer.py",
    "src/landuse_filter/adapters/remote/*",
    "src/landuse_filter/application/node_main.py",
    "src/landuse_filter/cli/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ty.src]
include = ["src"]

[tool.ty.terminal]
error-on-warning = true

[tool.importlinter]
root_packages = ["landuse_filter"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure (no adapters, no I/O libraries)"
type = "forbidden"
source_modules = ["landuse_filter.domain"]
forbidden_modules = [
    "landuse_filter.adapters",
    "landuse_filter.application",
    "landuse_filter.cli",
    "pathlib",
    "os",
    "subprocess",
    "typer",
    "pyarrow",
    "transformers",
    "huggingface_hub",
    "sglang",
]

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "landuse_filter.cli",
    "landuse_filter.application",
    "landuse_filter.adapters",
    "landuse_filter.domain",
]

[tool.mutmut]
source_paths = ["src/landuse_filter/domain/"]
pytest_add_cli_args_test_selection = ["tests/unit/", "tests/property/"]
also_copy = ["src/landuse_filter/", "tests/", "data/", "scripts/", "docs/", "pyproject.toml", "README.md", "luf.toml"]
